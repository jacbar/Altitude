# Stowable Altitude config.
# Copy to ~/.config/altitude/config.toml (or symlink via GNU Stow).

version = 1

[app]
# When true, Altitude registers with macOS Login Items (SMAppService) and starts at login.
# The menu bar "Launch at Login" item toggles this and writes it back to this file.
launch_at_login = false

[spaces]
# When true, switches jump through Spaces as fast as the Dock allows instead of
# playing a trackpad-like slide for each desktop crossed.
disable_animations = false
# When true, a trackpad Space swipe, Control-Left/Right, and Command-Tab cut straight across.
# Activating a running app on another same-display Space (Raycast, Spotlight, Dock, etc.)
# also hops there with no slide; the window is not moved onto the current Space.
# Command-Tab shows each open window, so two windows of the same app both appear
# (including windows on other Spaces). Left and Right move the highlight while Command
# is held; Command-Q quits and Command-H hides the highlighted app.
# The highlighted name is that window's title.
# Hotkey slides stay under disable_animations. Off by default — set true to enable.
disable_system_motions = false

[hotkeys]
# option+N switches to desktop N; option+shift+N moves the focused window.
switch_enabled = true
move_enabled = true
# Highest desktop number that gets a hotkey (1...max). Clamped to existing Spaces at runtime.
max_space = 9

[arrange]
# Control+Option+F maximizes every included window to the same inset visible frame.
# Control+Option+A lays them out in equal columns. margin (points) is the outer inset
# and the gap between columns. Both flags default true; a disabled chord is not registered.
margin = 8
maximize_enabled = true
columns_enabled = true
