# Rules tuned so this branch exits 0 without mass source rewrites.
# force_cast / file_length stay as warnings (CI does not use --strict).

excluded:
  - build
  - .build

disabled_rules:
  - trailing_comma
  - opening_brace

force_cast: warning
file_length:
  warning: 1000
  error: 2000

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 60
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 50

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - n
    - i
    - a
    - b
    - c
    - d
    - w
    - fm
    - eq
    - ax
    - cg
