name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Matrix expands check names (e.g. "test (macos-26)", "test (xcode-27)"); branch
  # protection still requires the exact context "build-test", so a final gate job
  # keeps that name.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install SwiftLint
        run: |
          curl -fsSL -o /tmp/portable_swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q /tmp/portable_swiftlint.zip -d /tmp/swiftlint
          sudo mv /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: SwiftLint
        run: swiftlint

      # Single xcodebuild test invocation (builds dependencies). Avoids a long-lived
      # unsigned app left from a separate build step that can stall the test host.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Altitude.xcodeproj \
            -scheme Altitude \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            -only-testing:AltitudeTests \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

  build-test:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All matrix jobs passed
        run: test "${{ needs.test.result }}" = "success"
